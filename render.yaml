services:
  - type: web
    name: moaplan
    runtime: node
    region: singapore
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.12.0
      - key: APP_URL
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: SETUP_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: moaplan-db
          property: connectionString
databases:
  - name: moaplan-db
    region: singapore
    databaseName: moaplan
    user: moaplan
    plan: basic-256mb
